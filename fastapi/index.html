    <!-- use above api endpoints to build ui in html  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(60,72,88,0.12);
            padding: 32px 28px 24px 28px;
        }
        h1 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 24px;
        }
        h2 {
            color: #6366f1;
            font-size: 1.1rem;
            margin-top: 28px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-weight: 500;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 12px;
            border: 1px solid #c7d2fe;
            border-radius: 6px;
            font-size: 1rem;
            background: #f1f5f9;
            transition: border 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border: 1.5px solid #6366f1;
            outline: none;
        }
        button {
            background: linear-gradient(90deg, #6366f1 0%, #3730a3 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(99,102,241,0.08);
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
        }
        .result, .error {
            margin: 12px 0 0 0;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .result {
            background: #e0e7ff;
            color: #3730a3;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
        }
        @media (max-width: 600px) {
            .container {
                max-width: 98vw;
                padding: 16px 6vw 16px 6vw;
            }
        }
    </style>
    <script>
        function showMessage(msg, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = msg;
            resultDiv.className = isError ? 'error' : 'result';
        }
        function clearMessage() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '';
            resultDiv.className = '';
        }
        async function addStudent() {
            clearMessage();
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value;
            if (!name || !age) {
                showMessage('Please enter both name and age.', true);
                return;
            }
            try {
                const response = await fetch('http://localhost:8000/students/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, age: Number(age)})
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message);
                } else {
                    showMessage(data.detail || 'Failed to add student.', true);
                }
            } catch (err) {
                showMessage('Server error. Please try again.', true);
            }
        }
        async function getStudent() {
            clearMessage();
            const studentId = document.getElementById('studentId').value;
            if (!studentId) {
                showMessage('Please enter a student ID.', true);
                return;
            }
            try {
                const response = await fetch(`http://localhost:8000/students/${studentId}`);
                const data = await response.json();
                if (response.ok) {
                    showMessage(`ID: ${data.student_id}, Name: ${data.name}, Age: ${data.age}`);
                } else {
                    showMessage(data.detail || 'Student not found.', true);
                }
            } catch (err) {
                showMessage('Server error. Please try again.', true);
            }
        }
        async function updateStudent() {
            clearMessage();
            const studentId = document.getElementById('updateStudentId').value;
            const name = document.getElementById('updateName').value.trim();
            const age = document.getElementById('updateAge').value;
            if (!studentId || (!name && !age)) {
                showMessage('Please enter student ID and at least one field to update.', true);
                return;
            }
            try {
                const response = await fetch(`http://localhost:8000/students/update/${studentId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        ...(name && {name}),
                        ...(age && {age: Number(age)})
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message);
                } else {
                    showMessage(data.detail || 'Failed to update student.', true);
                }
            } catch (err) {
                showMessage('Server error. Please try again.', true);
            }
        }
        async function deleteStudent() {
            clearMessage();
            const studentId = document.getElementById('deleteStudentId').value;
            if (!studentId) {
                showMessage('Please enter a student ID.', true);
                return;
            }
            try {
                const response = await fetch(`http://localhost:8000/students/delete/${studentId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message);
                } else {
                    showMessage(data.detail || 'Failed to delete student.', true);
                }
            } catch (err) {
                showMessage('Server error. Please try again.', true);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Student Management</h1>
        <div id="result"></div>
        <h2>Add Student</h2>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Name">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Age">
        <button onclick="addStudent()">Add Student</button>

        <h2>Get Student</h2>
        <label for="studentId">Student ID</label>
        <input type="number" id="studentId" placeholder="Student ID">
        <button onclick="getStudent()">Get Student</button>

        <h2>Update Student</h2>
        <label for="updateStudentId">Student ID</label>
        <input type="number" id="updateStudentId" placeholder="Student ID">
        <label for="updateName">New Name</label>
        <input type="text" id="updateName" placeholder="New Name">
        <label for="updateAge">New Age</label>
        <input type="number" id="updateAge" placeholder="New Age">
        <button onclick="updateStudent()">Update Student</button>

        <h2>Delete Student</h2>
        <label for="deleteStudentId">Student ID</label>
        <input type="number" id="deleteStudentId" placeholder="Student ID">
        <button onclick="deleteStudent()">Delete Student</button>
    </div>
</body>
</html>
